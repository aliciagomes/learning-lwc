<template>
    <lightning-card title="Welcome Checkbox" icon-name="standard:approval">
        <div class="slds-m-around_medium">
            <lightning-input type="checkbox" label="Show Welcome Message" onchange={handleCheckboxChange}
                checked={isChecked}>
            </lightning-input>

            <template if:true={showMessage}>
                <div class="slds-m-top_medium">
                    <div class="slds-text-heading_medium slds-text-color_success">
                        Welcome
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
